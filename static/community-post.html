<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width">
<title>帖子详情 — AI 游戏社区评测分享平台</title>
<link rel="stylesheet" href="css/style.css?v=proto12">
</head>
<body>
<div id="navbar"></div>

<div class="wrap page">
  <a class="btn btn-sm" href="javascript:U.goBack('community.html')" style="margin:14px 0;">← 返回</a>
  <div id="postBox"><div class="loading">⏳ 加载中…</div></div>

  <!-- 评论区 -->
  <h3 class="section-title" style="margin-top:24px;">💬 评论区 <span id="cmtCount" class="dim" style="font-size:13px;"></span></h3>
  <div class="card" style="padding:16px; margin-bottom:16px;" id="cmtEditor">
    <div id="cmtLoginTip" class="dim" style="font-size:13px; display:none;">⚠️ <a href="login.html" style="color:var(--accent-2);">登录</a>后参与评论</div>
    <textarea class="input" id="cmtInput" rows="3" placeholder="友善发言，说点什么吧…" style="width:100%; resize:vertical;"></textarea>
    <div class="flex" style="justify-content:flex-end; margin-top:8px;">
      <button class="btn btn-primary btn-sm" id="cmtSubmit">发表评论</button>
    </div>
  </div>
  <div id="cmtZone"><div class="loading">⏳ 加载中…</div></div>
</div>

<div id="footerSlot"></div>

<script src="js/mock.js"></script>
<script src="js/api.js?v=cmnt1"></script>
<script src="js/auth.js?v=cmnt1"></script>
<script src="js/common.js?v=cmnt1"></script>
<script>
Auth.mountNav('community');
document.getElementById('footerSlot').innerHTML = U.footer();

var postId = parseInt(U.qs('id'), 10);
var post = null;

function avatarHtml(a, size) {
  if (a && a.avatar) return '<img class="avatar" style="width:' + (size || 32) + 'px;height:' + (size || 32) + 'px" src="' + U.esc(a.avatar) + '">';
  return '<span class="avatar" style="width:' + (size || 32) + 'px;height:' + (size || 32) + 'px;">' + U.esc((a && a.name || '?').slice(0, 1)) + '</span>';
}

function actionBar(p) {
  var u = Auth.user();
  return '<div class="flex" style="gap:10px; margin-top:14px; flex-wrap:wrap;">'
    + '<button class="btn btn-sm ' + (p.my_liked ? 'btn-primary' : '') + '" id="btnLike">👍 点赞 ' + U.fmtNum(p.like_count) + '</button>'
    + '<button class="btn btn-sm ' + (p.my_favorited ? 'btn-primary' : '') + '" id="btnFav">⭐ 收藏 ' + U.fmtNum(p.fav_count) + '</button>'
    + '<button class="btn btn-sm" id="btnShare">🔗 转发</button>'
    + '<button class="btn btn-sm" id="btnReport">🚩 举报</button>'
    + (p.can_delete ? '<button class="btn btn-sm" style="margin-left:auto; color:var(--red);" id="btnDelPost">🗑 删除帖子</button>' : '')
    + '</div>';
}

async function loadPost() {
  try { post = await Api.get('/community/posts/' + postId); }
  catch (e) {
    document.getElementById('postBox').innerHTML = '<div class="empty">' + U.esc(e.message) + '<br><br><a class="btn btn-sm" href="javascript:U.goBack(\'community.html\')">返回</a></div>';
    document.getElementById('cmtEditor').style.display = 'none';
    document.getElementById('cmtZone').innerHTML = '';
    return;
  }
  var imgs = (post.images || []).map(function (u) {
    return '<img src="' + U.esc(u) + '" loading="lazy" style="width:100%; max-width:420px; border-radius:10px; margin:8px 0; cursor:zoom-in;" onclick="window.open(this.src,\'_blank\')" onerror="this.style.display=\'none\'">';
  }).join('');
  document.getElementById('postBox').innerHTML =
    '<div class="card" style="padding:22px;">'
    + '<div class="flex" style="gap:10px; align-items:center; margin-bottom:10px;">'
    + avatarHtml(post.author)
    + '<div><div style="font-weight:600; font-size:14px;">' + U.esc(post.author.name) + '</div>'
    + '<div class="dim" style="font-size:12px;">' + U.fmtDate(post.created_at) + ' · 👁️ ' + U.fmtNum(post.view_count) + '</div></div>'
    + '<span class="badge badge-blue" style="margin-left:auto;">' + U.esc(post.tag) + '</span>'
    + '</div>'
    + '<h2 style="font-size:22px; margin:6px 0 12px;">' + U.esc(post.title) + '</h2>'
    + '<div style="font-size:15px; line-height:1.9; white-space:pre-wrap;">' + U.esc(post.content) + '</div>'
    + imgs
    + actionBar(post)
    + '</div>';

  document.getElementById('btnLike').onclick = toggleLike;
  document.getElementById('btnFav').onclick = toggleFav;
  document.getElementById('btnShare').onclick = sharePost;
  document.getElementById('btnReport').onclick = function () { openReport('post', postId); };
  var del = document.getElementById('btnDelPost');
  if (del) del.onclick = deletePost;

  if (!Auth.user()) document.getElementById('cmtLoginTip').style.display = '';
}

async function toggleLike() {
  if (!Auth.requireLogin()) return;
  var r = await Api.post('/community/posts/' + postId + '/like');
  post.my_liked = r.liked; post.like_count = r.like_count;
  var b = document.getElementById('btnLike');
  b.textContent = '👍 点赞 ' + U.fmtNum(r.like_count);
  b.classList.toggle('btn-primary', r.liked);
}
async function toggleFav() {
  if (!Auth.requireLogin()) return;
  var r = await Api.post('/community/posts/' + postId + '/favorite');
  post.my_favorited = r.favorited; post.fav_count = r.fav_count;
  var b = document.getElementById('btnFav');
  b.textContent = '⭐ 收藏 ' + U.fmtNum(r.fav_count);
  b.classList.toggle('btn-primary', r.favorited);
}
function sharePost() {
  var url = location.origin + location.pathname + '?id=' + postId;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(function () { U.toast('链接已复制，快去转发吧', 'success'); });
  } else {
    window.open(url, '_blank');
  }
}
async function deletePost() {
  if (!confirm('确定删除这条帖子？删除后不可恢复。')) return;
  try {
    await Api.del('/community/posts/' + postId);
    U.toast('帖子已删除', 'success');
    setTimeout(function () { location.href = 'community.html'; }, 700);
  } catch (e) { U.toast(e.message, 'error'); }
}

/* ---------- 举报弹窗 ---------- */
var REPORT_REASONS = ['垃圾广告', '辱骂攻击', '色情低俗', '违法违规', '诈骗引流', '其他'];
function openReport(type, id) {
  if (!Auth.requireLogin()) return;
  var opts = REPORT_REASONS.map(function (r) { return '<label style="display:block; margin:6px 0;"><input type="radio" name="rpReason" value="' + r + '" ' + (r === '其他' ? 'checked' : '') + '> ' + r + '</label>'; }).join('');
  U.openModal(
    '<h3 style="margin-bottom:10px;">🚩 举报' + (type === 'post' ? '帖子' : '评论') + '</h3>'
    + opts
    + '<textarea class="input" id="rpDetail" rows="2" placeholder="补充说明（可选）" style="width:100%; margin:8px 0;"></textarea>'
    + '<div class="flex" style="gap:10px; justify-content:flex-end;">'
    + '<button class="btn btn-sm" onclick="U.closeModal()">取消</button>'
    + '<button class="btn btn-primary btn-sm" id="rpSubmit">提交举报</button></div>');
  document.getElementById('rpSubmit').onclick = async function () {
    var reason = document.querySelector('input[name=rpReason]:checked').value;
    var detail = document.getElementById('rpDetail').value.trim();
    try {
      await Api.post('/community/reports', { target_type: type, target_id: id, reason: reason, detail: detail });
      U.closeModal();
      U.toast('举报已提交，管理员会尽快处理', 'success');
    } catch (e) { U.toast(e.message, 'error'); }
  };
}

/* ---------- 评论区 ---------- */
function commentNode(c, isReply) {
  var u = Auth.user();
  var html = '<div class="cmt-item' + (isReply ? ' cmt-reply' : '') + '" data-id="' + c.id + '" style="' + (isReply ? 'margin-left:42px; margin-top:10px; padding-left:12px; border-left:2px solid var(--border);' : '') + '">'
    + '<div class="flex" style="gap:8px; align-items:flex-start;">'
    + avatarHtml(c.author, 26)
    + '<div style="min-width:0; flex:1;">'
    + '<div style="font-size:13px; font-weight:600;">' + U.esc(c.author.name)
    + ' <span class="dim" style="font-weight:400; font-size:11.5px;">' + U.fmtDate(c.created_at) + '</span></div>'
    + '<div style="font-size:14px; line-height:1.7; margin:4px 0; white-space:pre-wrap;">' + U.esc(c.content) + '</div>'
    + '<div class="flex dim" style="gap:14px; font-size:12px;">'
    + '<a href="javascript:void(0)" class="cmt-like" data-id="' + c.id + '">👍 ' + (c.my_liked ? '已赞 ' : '') + U.fmtNum(c.like_count) + '</a>'
    + (u ? '<a href="javascript:void(0)" class="cmt-reply-btn" data-id="' + c.id + '">回复</a>' : '')
    + (c.can_delete ? '<a href="javascript:void(0)" class="cmt-del" data-id="' + c.id + '" style="color:var(--red);">删除</a>' : '')
    + '</div>'
    + '<div class="reply-box" data-parent="' + c.id + '" style="display:none; margin:8px 0;">'
    + '<textarea class="input reply-input" rows="2" style="width:100%;" placeholder="回复 ' + U.esc(c.author.name) + '…"></textarea>'
    + '<div class="flex" style="justify-content:flex-end; margin-top:6px;"><button class="btn btn-primary btn-sm reply-send" data-parent="' + c.id + '">发送</button></div>'
    + '</div>'
    + '</div></div></div>';
  (c.replies || []).forEach(function (r) { html += commentNode(r, true); });
  return html;
}

async function loadComments() {
  try {
    var data = await Api.get('/community/posts/' + postId + '/comments');
    document.getElementById('cmtCount').textContent = '(' + data.total + ')';
    document.getElementById('cmtZone').innerHTML = data.items.length
      ? data.items.map(function (c) { return commentNode(c, false); }).join('')
      : '<div class="empty">还没有评论，来抢沙发吧～</div>';
    bindCommentEvents();
  } catch (e) {
    document.getElementById('cmtZone').innerHTML = '<div class="empty">' + U.esc(e.message) + '</div>';
  }
}

function bindCommentEvents() {
  U.$all('.cmt-like').forEach(function (el) {
    el.onclick = async function () {
      if (!Auth.requireLogin()) return;
      var id = parseInt(el.dataset.id, 10);
      try {
        var r = await Api.post('/community/comments/' + id + '/like');
        el.textContent = '👍 ' + (r.liked ? '已赞 ' : '') + U.fmtNum(r.like_count);
      } catch (e) { U.toast(e.message, 'error'); }
    };
  });
  U.$all('.cmt-reply-btn').forEach(function (el) {
    el.onclick = function () {
      var box = document.querySelector('.reply-box[data-parent="' + el.dataset.id + '"]');
      if (box) box.style.display = box.style.display === 'none' ? 'block' : 'none';
    };
  });
  U.$all('.reply-send').forEach(function (btn) {
    btn.onclick = async function () {
      var parent = btn.dataset.parent;
      var input = document.querySelector('.reply-box[data-parent="' + parent + '"] .reply-input');
      var content = input.value.trim();
      if (!content) { U.toast('回复内容不能为空', 'error'); return; }
      try {
        await Api.post('/community/posts/' + postId + '/comments', { content: content, parent_id: parseInt(parent, 10) });
        U.toast('回复成功', 'success');
        loadComments();
      } catch (e) { U.toast(e.message, 'error'); }
    };
  });
  U.$all('.cmt-del').forEach(function (el) {
    el.onclick = async function () {
      if (!confirm('确定删除这条评论？')) return;
      try {
        await Api.del('/community/comments/' + el.dataset.id);
        U.toast('评论已删除', 'success');
        loadComments(); loadPost();
      } catch (e) { U.toast(e.message, 'error'); }
    };
  });
}

document.getElementById('cmtSubmit').onclick = async function () {
  if (!Auth.requireLogin()) return;
  var content = document.getElementById('cmtInput').value.trim();
  if (!content) { U.toast('评论内容不能为空', 'error'); return; }
  try {
    await Api.post('/community/posts/' + postId + '/comments', { content: content });
    document.getElementById('cmtInput').value = '';
    U.toast('评论成功', 'success');
    loadComments(); loadPost();
  } catch (e) { U.toast(e.message, 'error'); }
};

loadPost();
loadComments();
</script>
</body>
</html>
