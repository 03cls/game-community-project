<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>管理控制台 — AI 游戏社区评测分享平台</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="navbar"></div>
<div class="admin-layout">
  <aside class="admin-side" id="adminSide"></aside>
  <main class="admin-main">
    <h2 class="section-title">📊 数据仪表盘</h2>

    <div class="grid grid-4 mb-16">
      <div class="card stat-card"><div class="num" id="stUsers" style="color:var(--accent-2);">-</div><div class="label">总用户数</div></div>
      <div class="card stat-card"><div class="num" id="stGames" style="color:var(--green);">-</div><div class="label">游戏总数</div></div>
      <div class="card stat-card"><div class="num" id="stReviews" style="color:var(--gold);">-</div><div class="label">评测攻略总数</div></div>
      <div class="card stat-card"><div class="num" id="stPending" style="color:var(--red);">-</div><div class="label">待审核内容</div></div>
    </div>

    <div class="grid grid-2" style="align-items:start;">
      <div class="card">
        <h3 class="section-title" style="font-size:16px;">⚖️ 待审核内容 <a class="more" href="audit-queue.html">前往处理 →</a></h3>
        <div class="table-wrap"><table class="data">
          <thead><tr><th>标题</th><th>AI 风险分</th><th>状态</th></tr></thead>
          <tbody id="pendingBody"></tbody>
        </table></div>
      </div>
      <div class="card">
        <h3 class="section-title" style="font-size:16px;">📝 待处理创作者申请 <a class="more" href="user.html">前往处理 →</a></h3>
        <div class="table-wrap"><table class="data">
          <thead><tr><th>申请人</th><th>申请理由</th><th>时间</th></tr></thead>
          <tbody id="applyBody"></tbody>
        </table></div>
      </div>
    </div>
  </main>
</div>

<script src="../js/mock.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/common.js"></script>
<script>
if (!Auth.mountAdmin('dashboard')) throw new Error('redirect');

async function init() {
  var d = await Api.get('/admin/dashboard');
  document.getElementById('stUsers').textContent = d.user_count;
  document.getElementById('stGames').textContent = d.game_count;
  document.getElementById('stReviews').textContent = d.review_count;
  document.getElementById('stPending').textContent = d.pending_count;

  var pending = await Api.get('/admin/reviews/pending');
  document.getElementById('pendingBody').innerHTML = pending.items.length ? pending.items.map(function (r) {
    return '<tr><td>' + U.esc(r.title) + '</td><td><span class="score">' + (r.audit_score != null ? r.audit_score : '-') + '</span></td><td>' + U.reviewBadge(r.status) + '</td></tr>';
  }).join('') : '<tr><td colspan="3" class="empty dim">暂无待审核内容 🎉</td></tr>';

  var applies = await Api.get('/admin/creator-apply?status=pending');
  document.getElementById('applyBody').innerHTML = applies.items.length ? applies.items.map(function (a) {
    return '<tr><td>' + U.esc(a.nickname) + '</td><td class="dim" style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + U.esc(a.apply_reason) + '</td><td class="dim">' + U.fmtDate(a.created_at) + '</td></tr>';
  }).join('') : '<tr><td colspan="3" class="empty dim">暂无待处理申请</td></tr>';
}
init();
</script>
</body>
</html>
