<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>评测编辑 — AI 游戏社区评测分享平台</title>
<link rel="stylesheet" href="css/style.css?v=proto12">
</head>
<body>
<div id="navbar"></div>

<div class="wrap page">
  <div class="grid" style="grid-template-columns: 1fr 360px; gap:20px; align-items:start;">

    <!-- 编辑器区 -->
    <div>
      <div class="card mb-16">
        <div class="form-row">
          <div class="form-group" style="flex:2;">
            <label>标题</label>
            <input class="input" id="title" placeholder="给评测起个吸引人的标题…">
          </div>
          <div class="form-group" style="flex:1;">
            <label>关联游戏</label>
            <select class="input" id="gameSelect"></select>
          </div>
        </div>
        <div class="form-group">
          <label>标签（逗号分隔）</label>
          <input class="input" id="tags" placeholder="例如：魂系, 开放世界, 年度游戏">
        </div>
        <div class="form-group">
          <label>四维评分（1-10 分，必填，发布后自动聚合进游戏总评分）</label>
          <div class="grid" style="grid-template-columns:repeat(4,1fr); gap:10px;">
            <div><span class="dim" style="font-size:12px;">📖 剧情</span><input class="input" type="number" id="score_story" min="1" max="10" placeholder="1-10"></div>
            <div><span class="dim" style="font-size:12px;">🎨 画面</span><input class="input" type="number" id="score_graphic" min="1" max="10" placeholder="1-10"></div>
            <div><span class="dim" style="font-size:12px;">🎮 玩法</span><input class="input" type="number" id="score_gameplay" min="1" max="10" placeholder="1-10"></div>
            <div><span class="dim" style="font-size:12px;">⚙️ 优化</span><input class="input" type="number" id="score_opt" min="1" max="10" placeholder="1-10"></div>
          </div>
        </div>
      </div>

      <div class="card" style="padding:0; overflow:hidden;">
        <div class="editor-toolbar">
          <button type="button" onclick="fmt('bold')"><b>B</b></button>
          <button type="button" onclick="fmt('italic')"><i>I</i></button>
          <button type="button" onclick="fmt('h2')">H2</button>
          <button type="button" onclick="fmt('ul')">• 列表</button>
          <button type="button" onclick="fmt('link')">🔗 链接</button>
          <button type="button" onclick="fmt('p')">¶ 正文</button>
        </div>
        <div class="editor-area" id="editor" contenteditable="true" data-placeholder="在这里写下你的评测正文… 可以使用右侧 AI 助手帮你生成大纲、润色文案。"></div>
      </div>

      <div class="flex mt-16" style="justify-content:flex-end; gap:10px;">
        <a class="btn" href="javascript:U.goBack('creator-work.html')">← 返回</a>
        <button class="btn" id="saveDraftBtn">💾 保存草稿</button>
        <button class="btn btn-primary" id="submitBtn">🚀 提交审核（管理员审核）</button>
      </div>
    </div>

    <!-- AI 助手 -->
    <div class="ai-panel" style="position:sticky; top:76px; max-height:calc(100vh - 96px);">
      <div class="ai-title">🤖 AI 攻略创作助手</div>
      <p class="dim" style="font-size:12px; margin-bottom:10px;">自动携带当前关联游戏与正文上下文</p>
      <div class="ai-chips" id="aiChips">
        <span class="tag clickable" data-action="outline">生成评测大纲</span>
        <span class="tag clickable" data-action="tips">通关思路</span>
        <span class="tag clickable" data-action="polish">润色文案</span>
        <span class="tag clickable" data-action="pros">分析优缺点</span>
        <span class="tag clickable" data-qs="帮我写一个吸引人的开头|给我一个场景感强的开场|用悬念式写法写个开头">写开头</span>
        <span class="tag clickable" data-qs="帮我写一个总结性的结尾|写一个有升华感的结尾|结尾怎么呼应开头">写结尾</span>
        <span class="tag clickable" data-qs="帮我起几个有记忆点的标题|起几个带悬念的标题|起几个带数字对比的标题">起标题</span>
        <span class="tag clickable" data-qs="四维评分应该怎么给分|剧情和玩法分差很大怎么平衡|评分一般参考哪些标准">评分建议</span>
      </div>
      <div class="chat-box" id="chatBox">
        <div class="chat-msg ai">你好！我是你的 AI 写作助手 ✨<br>我可以帮你生成评测大纲、梳理通关思路、润色文案、分析优缺点，也能写开头/结尾、起标题、给评分建议。点击上方标签或直接描述需求～</div>
      </div>
      <div class="ai-input-row">
        <input class="input" id="aiInput" placeholder="输入消息，回车发送…">
        <button class="btn btn-primary" id="aiSend">发送</button>
      </div>
    </div>
  </div>
</div>

<div id="footerSlot"></div>

<script src="js/mock.js"></script>
<script src="js/api.js?v=cmnt1"></script>
<script src="js/auth.js?v=cmnt1"></script>
<script src="js/common.js?v=cmnt1"></script>
<script>
if (!Auth.requireRole('creator')) throw new Error('redirect');
Auth.mountNav('creator');
document.getElementById('footerSlot').innerHTML = U.footer();

var editId = U.qs('id') ? parseInt(U.qs('id'), 10) : null;
var games = [];

async function init() {
  var data = await Api.get('/games?page=1&page_size=50&sort=hot');
  games = data.items;
  document.getElementById('gameSelect').innerHTML = games.map(function (g) {
    return '<option value="' + g.id + '">' + g.name + '（' + g.name_en + '）</option>';
  }).join('');

  if (editId) {
    var list = await Api.get('/creator/reviews');
    var rv = list.items.filter(function (r) { return r.id === editId; })[0];
    if (rv) {
      document.getElementById('title').value = rv.title;
      document.getElementById('gameSelect').value = rv.game_id;
      document.getElementById('tags').value = (rv.tags || []).join(',');
      ['score_story', 'score_graphic', 'score_gameplay', 'score_opt'].forEach(function (k) {
        var el = document.getElementById(k);
        if (el) el.value = rv[k] == null ? '' : rv[k];
      });
      document.getElementById('editor').innerHTML = rv.content || '';
      if (rv.status === 'published') {
        var me = Auth.user() || {};
        if (rv.edit_used) U.toast('该评测的 1 次编辑机会已用完，内容只读', 'info');
        else if ((me.creator_level || 0) >= 1) U.toast('L1 权益：已发布评测可编辑保存 1 次', 'info');
        else U.toast('L0 见习创作者不可编辑已发布评测，升至 L1（200 积分）解锁', 'info');
      }
    }
  }
}

/* 富文本工具 */
window.fmt = function (cmd) {
  var editor = document.getElementById('editor');
  editor.focus();
  if (cmd === 'h2') document.execCommand('formatBlock', false, 'h2');
  else if (cmd === 'p') document.execCommand('formatBlock', false, 'p');
  else if (cmd === 'ul') document.execCommand('insertUnorderedList', false, null);
  else if (cmd === 'link') {
    var url = prompt('输入链接地址：', 'https://');
    if (url) document.execCommand('createLink', false, url);
  }
  else document.execCommand(cmd, false, null);
};

function collect() {
  var SCORE_KEYS = ['score_story', 'score_graphic', 'score_gameplay', 'score_opt'];
  var scores = {};
  SCORE_KEYS.forEach(function (k) {
    var v = document.getElementById(k).value.trim();
    if (v === '') { scores[k] = null; return; }
    var n = parseInt(v, 10);
    if (isNaN(n) || n < 1 || n > 10) {
      var names = { score_story: '剧情', score_graphic: '画面', score_gameplay: '玩法', score_opt: '优化' };
      throw { __input: true, msg: names[k] + '评分必须是 1-10 的整数' };
    }
    scores[k] = n;
  });
  return {
    title: document.getElementById('title').value.trim(),
    game_id: parseInt(document.getElementById('gameSelect').value, 10),
    tags: document.getElementById('tags').value.split(/[,，]/).map(function (s) { return s.trim(); }).filter(Boolean),
    content: document.getElementById('editor').innerHTML,
    score_story: scores.score_story,
    score_graphic: scores.score_graphic,
    score_gameplay: scores.score_gameplay,
    score_opt: scores.score_opt
  };
}

async function saveDraft() {
  var body;
  try { body = collect(); }
  catch (e) { if (e && e.__input) { U.toast(e.msg, 'error'); return null; } throw e; }
  if (!body.title) { U.toast('请先填写标题', 'error'); return null; }
  try {
    if (editId) {
      var upd = await Api.put('/reviews/' + editId, body);
      U.toast(upd.status === 'published' ? '已发布评测已更新（1 次编辑机会已使用）' : '草稿已保存', 'success');
    } else {
      var r = await Api.post('/reviews', body);
      editId = r.id;
      history.replaceState(null, '', 'creator-edit.html?id=' + editId);
      U.toast('草稿已创建', 'success');
    }
    return true;
  } catch (e) { U.toast(e.message, 'error'); return false; }
}

document.getElementById('saveDraftBtn').onclick = saveDraft;

document.getElementById('submitBtn').onclick = async function () {
  var body;
  try { body = collect(); }
  catch (e) { if (e && e.__input) { U.toast(e.msg, 'error'); return; } throw e; }
  if (!body.title) { U.toast('请先填写标题', 'error'); return; }
  if (body.score_story == null || body.score_graphic == null || body.score_gameplay == null || body.score_opt == null) {
    U.toast('提交审核前请填写全部四维评分（1-10 分）', 'error'); return;
  }
  if (!body.content || body.content.replace(/<[^>]+>/g, '').trim().length < 20) {
    U.toast('正文内容太少了，至少写点什么吧', 'error'); return;
  }
  /* 先保存再提交 */
  var ok = await saveDraft();
  if (!ok) return;
  try {
    var res = await Api.post('/reviews/' + editId + '/submit-audit');
    if (res.status === 'pending') {
      U.toast('⏳ ' + (res.message || '已提交审核，等待管理员审核'), 'info');
    } else if (res.status === 'published') {
      U.toast('🎉 审核通过，文章已发布！', 'success');
    } else if (res.status === 'rejected') {
      U.toast('❌ 已驳回：' + (res.audit && res.audit.reasons ? res.audit.reasons.join('；') : ''), 'error');
    }
    setTimeout(function () { location.href = 'creator-work.html'; }, 1500);
  } catch (e) { U.toast(e.message, 'error'); }
};

/* ---------- AI 助手 ---------- */
function addMsg(text, who) {
  var box = document.getElementById('chatBox');
  var el = document.createElement('div');
  el.className = 'chat-msg ' + who;
  el.textContent = text;
  box.appendChild(el);
  if (who === 'ai') {
    var actions = document.createElement('div');
    actions.style.cssText = 'margin-top:6px;';
    actions.innerHTML = '<button class="btn btn-sm btn-primary">📋 复制到编辑器</button>';
    actions.querySelector('button').onclick = function () {
      var html = text.split('\n').map(function (line) {
        if (/^[一二三四五六1-6][、.)．]/.test(line.trim()) || /^[+·]/.test(line.trim())) return '<p>' + U.esc(line) + '</p>';
        return '<p>' + U.esc(line) + '</p>';
      }).join('');
      document.getElementById('editor').innerHTML += html;
      U.toast('已插入到编辑器末尾', 'success');
    };
    el.appendChild(actions);
  }
  box.scrollTop = box.scrollHeight;
}

var aiBusy = false;

async function askAi(message, action) {
  if (aiBusy) { U.toast('AI 还在思考，稍等一下～', 'info'); return; }
  aiBusy = true;
  addMsg(message, 'me');
  var body = collect();
  var box = document.getElementById('chatBox');
  var loading = document.createElement('div');
  loading.className = 'chat-msg ai';
  loading.textContent = 'AI 思考中…（3-8 秒）';
  box.appendChild(loading);
  box.scrollTop = box.scrollHeight;
  try {
    var res = await Api.post('/ai/creator-assistant', {
      game_id: body.game_id,
      content_context: body.content,
      message: message,
      action: action || ''
    });
    loading.remove();
    addMsg(res.reply, 'ai');
  } catch (e) {
    loading.remove();
    addMsg('出错了：' + e.message, 'ai');
  } finally {
    aiBusy = false;
  }
}

window.quickAi = function (action) {
  var map = { outline: '帮我生成一篇评测大纲', tips: '给我一些通关思路', polish: '帮我润色当前文案', pros: '分析一下这款游戏的优缺点' };
  askAi(map[action], action);
};

window.quickAskC = function (q) {
  var input = document.getElementById('aiInput');
  if (input.disabled) return;   // 上一条请求还在处理，避免重复发送
  input.value = '';
  askAi(q, '');
};

/* 快捷标签：事件委托；data-action 直发，data-qs 按顺序轮换发送候选问题 */
document.getElementById('aiChips').addEventListener('click', function (e) {
  var t = e.target.closest('.tag');
  if (!t) return;
  if (t.dataset.action) { quickAi(t.dataset.action); return; }
  if (t.dataset.qs) {
    var qs = t.dataset.qs.split('|').filter(Boolean);
    if (!qs.length) return;
    var i = parseInt(t.dataset.mi || '0', 10) % qs.length;
    t.dataset.mi = String(i + 1);
    quickAskC(qs[i]);
  }
});

document.getElementById('aiSend').onclick = function () {
  var input = document.getElementById('aiInput');
  if (!input.value.trim()) return;
  var msg = input.value.trim();
  input.value = '';
  askAi(msg, '');
};
document.getElementById('aiInput').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') document.getElementById('aiSend').click();
});

init();
</script>
</body>
</html>
