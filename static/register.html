<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>注册 — AI 游戏社区评测分享平台</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-page">
  <div class="card auth-card">
    <div class="logo" style="font-size:22px; text-align:center;">🎮 GameReview AI</div>
    <p class="muted" style="text-align:center; margin-top:6px;">加入社区，发现好游戏</p>

    <div class="auth-tabs">
      <a href="login.html">登录</a>
      <a href="register.html" class="active">注册</a>
    </div>

    <form onsubmit="return doRegister(event)">
      <div class="form-group">
        <label>用户名</label>
        <input class="input" id="username" placeholder="3-20 位字符" required minlength="3" maxlength="20">
      </div>
      <div class="form-group">
        <label>邮箱</label>
        <input class="input" id="email" type="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label>密码</label>
        <input class="input" id="password" type="password" placeholder="至少 6 位" required minlength="6">
      </div>
      <div class="form-group">
        <label>确认密码</label>
        <input class="input" id="password2" type="password" placeholder="再次输入密码" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit" id="regBtn">注 册</button>
      <p class="form-tip" style="text-align:center; margin-top:12px;">注册成功后将跳转登录页，注册不自动登录</p>
    </form>
  </div>
</div>

<script src="js/mock.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script>
async function doRegister(e) {
  e.preventDefault();
  var pwd = document.getElementById('password').value;
  if (pwd !== document.getElementById('password2').value) {
    U.toast('两次输入的密码不一致', 'error'); return false;
  }
  var btn = document.getElementById('regBtn');
  btn.disabled = true; btn.textContent = '注册中…';
  try {
    await Api.post('/auth/register', {
      username: document.getElementById('username').value.trim(),
      email: document.getElementById('email').value.trim(),
      password: pwd
    });
    U.toast('注册成功，请登录', 'success');
    setTimeout(function () { location.href = 'login.html'; }, 800);
  } catch (err) {
    U.toast(err.message || '注册失败', 'error');
    btn.disabled = false; btn.textContent = '注 册';
  }
  return false;
}
</script>
</body>
</html>
