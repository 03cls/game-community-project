<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>登录 — AI 游戏社区评测分享平台</title>
<link rel="stylesheet" href="css/style.css?v=proto12">
</head>
<body>
<div class="auth-page">
  <div class="card auth-card">
    <div class="logo" style="font-size:22px; text-align:center;">🎮 GameReview AI</div>
    <p class="muted" style="text-align:center; margin-top:6px;">发现好游戏，分享真体验</p>

    <div class="auth-tabs">
      <a href="login.html" class="active">登录</a>
      <a href="register.html">注册</a>
    </div>

    <form id="loginForm" onsubmit="return doLogin(event)">
      <div class="form-group">
        <label>用户名 / 邮箱</label>
        <input class="input" id="account" placeholder="请输入用户名或邮箱" required>
      </div>
      <div class="form-group">
        <label>密码</label>
        <input class="input" id="password" type="password" placeholder="请输入密码" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit" id="loginBtn">登 录</button>
    </form>

    <div class="divider"></div>
    <div class="card" style="background:var(--surface-2); padding:14px; font-size:13px;">
      <b>🧪 测试账号（Mock 种子数据）</b>
      <p class="dim" style="margin-top:8px; line-height:2;">
        管理员：<code>admin / admin123</code><br>
        创作者：<code>creator / creator123</code><br>
        玩家：<code>player / player123</code>
      </p>
    </div>
  </div>
</div>

<script src="js/mock.js"></script>
<script src="js/api.js?v=cmnt1"></script>
<script src="js/common.js?v=cmnt1"></script>
<script>
/* add=1 模式：追加账号（不退出已有账号） */
var isAddMode = U.qs('add') === '1';
if (isAddMode) {
  document.title = '添加账号 — GameReview AI';
  var btn = document.getElementById('loginBtn');
  if (btn) btn.textContent = '➕ 添加并切换';
  var notice = document.createElement('div');
  notice.className = 'dim';
  notice.style.cssText = 'text-align:center; font-size:12px; margin-bottom:10px; color:var(--accent-2);';
  notice.textContent = '🔄 添加账号模式：登录后可在导航栏随时切换账号';
  document.getElementById('loginForm').insertBefore(notice, document.getElementById('loginForm').firstChild);
}

async function doLogin(e) {
  e.preventDefault();
  var btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = '登录中…';
  try {
    var res = await Api.post('/auth/login', {
      username_or_email: document.getElementById('account').value.trim(),
      password: document.getElementById('password').value
    });
    Api.setSession(res.access_token, res.user);
    U.toast(isAddMode ? '账号添加成功！' : '登录成功，欢迎回来！', 'success');
    var redirect = U.qs('redirect');
    setTimeout(function () {
      if (redirect) location.href = redirect;
      else if (isAddMode) {
        /* 添加账号模式：回到首页，用户可自行导航 */
        location.href = 'index.html';
      } else if (res.role === 'admin') location.href = 'admin/index.html';
      else location.href = 'index.html';
    }, 700);
  } catch (err) {
    U.toast(err.message || '登录失败', 'error');
    btn.disabled = false; btn.textContent = isAddMode ? '➕ 添加并切换' : '登 录';
  }
  return false;
}
</script>
</body>
</html>
