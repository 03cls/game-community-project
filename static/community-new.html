<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width">
<title>发帖 — AI 游戏社区评测分享平台</title>
<link rel="stylesheet" href="css/style.css?v=proto12">
</head>
<body>
<div id="navbar"></div>

<div class="wrap page" style="max-width:760px;">
  <a class="btn btn-sm" href="javascript:U.goBack('community.html')" style="margin:14px 0;">← 返回</a>
  <div class="card" style="padding:24px;">
    <h3 class="section-title" style="margin-top:0;">✏️ 发布新帖</h3>
    <div class="dim" style="font-size:12.5px; margin-bottom:14px;">📌 全员可发帖，发布即公开。请遵守社区规范，违规内容将被删除并可能封禁账号。</div>

    <label class="form-label">标题 <span class="dim" style="font-weight:400;">（2-100 字）</span></label>
    <input class="input" id="fTitle" maxlength="100" placeholder="一句话说清你的主题…" style="width:100%;">

    <label class="form-label" style="margin-top:14px;">标签</label>
    <div id="tagPick" class="flex" style="gap:8px; flex-wrap:wrap;"></div>

    <label class="form-label" style="margin-top:14px;">正文 <span class="dim" style="font-weight:400;">（支持纯文字 / 图文混排）</span></label>
    <textarea class="input" id="fContent" rows="10" placeholder="分享你的游戏体验、攻略、吐槽……" style="width:100%; resize:vertical;"></textarea>

    <label class="form-label" style="margin-top:14px;">图片 <span class="dim" style="font-weight:400;">（可选，最多 9 张，单张 ≤5MB）</span></label>
    <div class="flex" style="gap:10px; flex-wrap:wrap;" id="imgPrev"></div>
    <input type="file" id="imgFile" accept="image/*" multiple style="display:none;">
    <button class="btn btn-sm" id="btnPickImg" style="margin-top:10px;">📷 添加图片</button>

    <div class="flex" style="gap:12px; margin-top:22px;">
      <button class="btn btn-primary" id="btnSubmit" style="flex:1;">🚀 发布</button>
      <button class="btn" id="btnCancel">取消</button>
    </div>
  </div>
</div>

<div id="footerSlot"></div>

<script src="js/mock.js"></script>
<script src="js/api.js?v=cmnt1"></script>
<script src="js/auth.js?v=cmnt1"></script>
<script src="js/common.js?v=cmnt1"></script>
<script>
Auth.mountNav('community');
document.getElementById('footerSlot').innerHTML = U.footer();
if (!Auth.requireLogin()) throw new Error('redirecting');

var TAGS = ['游戏', '闲聊', '攻略', '吐槽'];
var tag = '闲聊';
var images = [];

function renderTags() {
  document.getElementById('tagPick').innerHTML = TAGS.map(function (t) {
    return '<button type="button" class="btn btn-sm ' + (t === tag ? 'btn-primary' : '') +
      '" data-tag="' + t + '">' + t + '</button>';
  }).join('');
  U.$all('#tagPick button').forEach(function (b) {
    b.onclick = function () { tag = b.dataset.tag; renderTags(); };
  });
}
renderTags();

function renderImgs() {
  document.getElementById('imgPrev').innerHTML = images.map(function (u, i) {
    return '<div style="position:relative;">'
      + '<img src="' + U.esc(u) + '" style="width:120px; height:90px; object-fit:cover; border-radius:8px; border:1px solid var(--border);">'
      + '<span style="position:absolute; top:-8px; right:-6px; background:var(--red); color:#fff; border-radius:50%; width:20px; height:20px; line-height:20px; text-align:center; cursor:pointer; font-size:12px;" data-i="' + i + '" class="img-del">×</span>'
      + '</div>';
  }).join('');
  U.$all('.img-del').forEach(function (x) {
    x.onclick = function () { images.splice(parseInt(x.dataset.i, 10), 1); renderImgs(); };
  });
}

document.getElementById('btnPickImg').onclick = function () {
  if (images.length >= 9) { U.toast('最多上传 9 张图片', 'error'); return; }
  document.getElementById('imgFile').click();
};

document.getElementById('imgFile').onchange = async function () {
  var files = Array.prototype.slice.call(this.files || []);
  for (var i = 0; i < files.length; i++) {
    if (images.length >= 9) { U.toast('最多 9 张，已忽略多余图片', 'error'); break; }
    var f = files[i];
    if (f.size > 5 * 1024 * 1024) { U.toast('图片「' + f.name + '」超过 5MB', 'error'); continue; }
    try {
      var url = await uploadOne(f);
      images.push(url);
    } catch (e) { U.toast('上传失败：' + e.message, 'error'); }
  }
  this.value = '';
  renderImgs();
};

function uploadOne(file) {
  return new Promise(function (resolve, reject) {
    var fd = new FormData();
    fd.append('file', file);
    fetch('/api/community/upload', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + Api.getToken() },
      body: fd
    }).then(function (res) {
      res.json().then(function (data) {
        if (res.ok) resolve(data.url);
        else reject(new Error(data.detail || '上传失败'));
      });
    }).catch(reject);
  });
}

document.getElementById('btnCancel').onclick = function () { location.href = 'community.html'; };

document.getElementById('btnSubmit').onclick = async function () {
  var title = document.getElementById('fTitle').value.trim();
  var content = document.getElementById('fContent').value.trim();
  if (title.length < 2) return U.toast('标题至少 2 个字', 'error');
  if (!content && !images.length) return U.toast('正文和图片至少填一项', 'error');
  var btn = this;
  btn.disabled = true;
  try {
    var r = await Api.post('/community/posts', { title: title, content: content, tag: tag, images: images });
    U.toast('发布成功', 'success');
    setTimeout(function () { location.href = 'community-post.html?id=' + r.post.id; }, 600);
  } catch (e) {
    U.toast(e.message, 'error');
    btn.disabled = false;
  }
};
</script>
</body>
</html>
