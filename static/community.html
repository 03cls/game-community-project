<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width">
<title>社区 — AI 游戏社区评测分享平台</title>
<link rel="stylesheet" href="css/style.css?v=proto12">
</head>
<body>
<div id="navbar"></div>

<div class="wrap page">
  <div class="flex" style="justify-content:space-between; align-items:center; margin:14px 0;">
    <h3 class="section-title" style="margin:0;">📢 玩家社区</h3>
    <a class="btn btn-primary" href="community-new.html" id="newPostBtn">✏️ 发帖</a>
  </div>

  <!-- 排序 + 标签筛选 + 搜索 -->
  <div class="card" style="padding:12px 18px; margin-bottom:16px;">
    <div class="flex" style="gap:10px; flex-wrap:wrap; align-items:center;">
      <div class="seg" id="sortSeg">
        <button data-sort="hot" class="active">🔥 推荐</button>
        <button data-sort="latest">🕒 最新</button>
      </div>
      <div class="tag-filter" id="tagBar" style="display:flex; gap:8px; flex-wrap:wrap;"></div>
      <div style="flex:1; min-width:180px;"></div>
      <input class="input" id="kw" placeholder="搜索帖子标题/正文…" style="max-width:260px;"
             onkeydown="if(event.key==='Enter')doSearch()">
      <button class="btn btn-primary" onclick="doSearch()">🔍 搜索</button>
    </div>
  </div>

  <div id="postZone"><div class="loading">⏳ 加载中…</div></div>
  <div id="pager"></div>
</div>

<div id="footerSlot"></div>

<script src="js/mock.js"></script>
<script src="js/api.js?v=cmnt1"></script>
<script src="js/auth.js?v=cmnt1"></script>
<script src="js/common.js?v=cmnt1"></script>
<script>
Auth.mountNav('community');
document.getElementById('footerSlot').innerHTML = U.footer();
document.getElementById('newPostBtn').onclick = function (e) {
  e.preventDefault();
  if (Auth.requireLogin()) location.href = 'community-new.html';
};

var state = { sort: 'hot', tag: '', keyword: '', page: 1, tags: [] };

function renderTagBar() {
  var all = ['全部'].concat(state.tags);
  document.getElementById('tagBar').innerHTML = all.map(function (t) {
    var val = t === '全部' ? '' : t;
    return '<button class="btn btn-sm ' + (state.tag === val ? 'btn-primary' : '') +
      '" onclick="selectTag(\'' + val + '\')">' + t + '</button>';
  }).join('');
}

function selectTag(t) {
  state.tag = t;
  state.page = 1;
  renderTagBar();   // 高亮跟随选中项，不能固定在「全部」
  load();
}
function doSearch() { state.keyword = document.getElementById('kw').value.trim(); state.page = 1; load(); }

U.$all('#sortSeg button').forEach(function (btn) {
  btn.onclick = function () {
    U.$all('#sortSeg button').forEach(function (b) { b.classList.remove('active'); });
    btn.classList.add('active');
    state.sort = btn.dataset.sort;
    state.page = 1;
    load();
  };
});

function avatarHtml(a) {
  if (a && a.avatar) return '<img class="avatar" src="' + U.esc(a.avatar) + '">';
  return '<span class="avatar">' + U.esc((a && a.name || '?').slice(0, 1)) + '</span>';
}

function postCard(p) {
  var imgs = (p.images || []).slice(0, 3).map(function (u) {
    return '<img src="' + U.esc(u) + '" loading="lazy" style="width:140px; height:90px; object-fit:cover; border-radius:8px;" onerror="this.style.display=\'none\'">';
  }).join('');
  return '<div class="card card-hover post-card" onclick="location.href=\'community-post.html?id=' + p.id + '\'">'
    + '<div class="flex" style="gap:10px; align-items:center; margin-bottom:8px;">'
    + avatarHtml(p.author)
    + '<span style="font-size:13px; font-weight:600;">' + U.esc(p.author.name) + '</span>'
    + '<span class="badge badge-blue">' + U.esc(p.tag) + '</span>'
    + '<span class="dim" style="font-size:12px; margin-left:auto;">' + U.fmtDate(p.created_at) + '</span>'
    + '</div>'
    + '<div class="post-title">' + U.esc(p.title) + '</div>'
    + '<p class="muted" style="font-size:13px; line-height:1.6; margin:6px 0;">' + U.esc(p.summary) + '</p>'
    + (imgs ? '<div class="flex" style="gap:8px; margin:8px 0;">' + imgs + '</div>' : '')
    + '<div class="flex dim" style="gap:16px; font-size:12.5px; margin-top:6px;">'
    + '<span>👁️ ' + U.fmtNum(p.view_count) + '</span>'
    + '<span>👍 ' + U.fmtNum(p.like_count) + '</span>'
    + '<span>⭐ ' + U.fmtNum(p.fav_count) + '</span>'
    + '<span>💬 ' + U.fmtNum(p.comment_count) + '</span>'
    + '</div></div>';
}

async function load(page) {
  if (page) state.page = page;
  var q = '/community/posts?sort=' + state.sort + '&page=' + state.page + '&page_size=10'
    + (state.tag ? '&tag=' + encodeURIComponent(state.tag) : '')
    + (state.keyword ? '&keyword=' + encodeURIComponent(state.keyword) : '');
  var data;
  try { data = await Api.get(q); }
  catch (e) {
    document.getElementById('postZone').innerHTML = '<div class="empty">' + U.esc(e.message) + '</div>';
    return;
  }
  document.getElementById('postZone').innerHTML = data.items.length
    ? data.items.map(postCard).join('')
    : '<div class="empty"><div class="icon">📭</div>没有找到相关帖子</div>';
  document.getElementById('pager').innerHTML = U.pagination(data.total_pages, data.page, load);
}

(async function init() {
  try {
    var t = await Api.get('/community/tags');
    state.tags = t.tags || [];
  } catch (e) { state.tags = ['游戏', '闲聊', '攻略', '吐槽']; }
  renderTagBar();
  // 支持 ?tag= / ?keyword= 直达
  state.tag = U.qs('tag');
  state.keyword = U.qs('keyword');
  if (state.keyword) document.getElementById('kw').value = state.keyword;
  renderTagBar();
  load();
})();
</script>
</body>
</html>
